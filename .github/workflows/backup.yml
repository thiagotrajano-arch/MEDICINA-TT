name: Backup e keep-alive

# Backup lógico semanal do Postgres (pg_dump) como artefato + ping para evitar
# a hibernação do Supabase Free (~7 dias ocioso). Custo zero.

on:
  schedule:
    - cron: "0 5 * * 1" # segunda-feira 05:00 UTC
    - cron: "15 5 * * *" # keep-alive diario 05:15 UTC
  workflow_dispatch: {}

jobs:
  backup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * 1' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração do backup
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL ausente. O backup não foi executado."
            exit 1
          fi
      - name: pg_dump
        run: |
          STAMP=$(date -u +%Y%m%d)
          BACKUP_FILE="backup_${STAMP}.dump"
          docker run --rm \
            -e SUPABASE_DB_URL \
            -e BACKUP_FILE="$BACKUP_FILE" \
            -v "$PWD:/backup" \
            postgres:17-alpine \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f "/backup/$BACKUP_FILE"'
          test -s "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
      - name: Guardar backup como artefato
        if: ${{ env.BACKUP_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
      - name: Validar restauração em PostgreSQL temporário
        if: ${{ env.BACKUP_FILE != '' }}
        run: |
          docker run --detach --name restore-check \
            --env POSTGRES_PASSWORD=restore-check \
            postgres:17-alpine
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec restore-check pg_isready -U postgres -d postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          sleep 3
          docker run --rm \
            --volume "$PWD:/backup" \
            --env BACKUP_FILE \
            --entrypoint sh \
            postgres:17-alpine \
            -c 'pg_restore --list "/backup/$BACKUP_FILE" | grep -viE "EXTENSION - (supabase_vault|vector|pg_trgm|unaccent)|COMMENT - EXTENSION (supabase_vault|vector|pg_trgm|unaccent)|vault|conteudo_embedding|trgm_ops|imutavel_unaccent|INDEX|POLICY|ACL" > /backup/restore.list'
          docker run --rm --network container:restore-check \
            --volume "$PWD:/backup:ro" \
            --env BACKUP_FILE \
            --entrypoint sh \
            postgres:17-alpine \
            -c 'pg_restore --exit-on-error --no-owner --no-privileges --use-list="/backup/restore.list" --dbname=postgresql://postgres:restore-check@localhost:5432/postgres "/backup/$BACKUP_FILE"'
      - name: Remover banco temporário de restauração
        if: ${{ always() }}
        run: docker rm --force restore-check || true

  keepalive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Validar configuração do keep-alive
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Variáveis públicas do Supabase ausentes. O keep-alive não foi executado."
            exit 1
          fi
      - name: Ping Supabase (anti-hibernação)
        run: |
          STATUS=$(curl --fail --silent --show-error --output /dev/null --write-out "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/disciplina?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Supabase respondeu HTTP ${STATUS}."
