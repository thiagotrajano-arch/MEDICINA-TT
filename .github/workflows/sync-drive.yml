name: Sync Google Drive

# Sync incremental only runs after explicit opt-in and a reviewed metadata baseline.
# Logs never show file names, identifiers, paths, or raw source errors.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      operacao:
        description: Operacao segura a executar
        required: true
        default: incremental
        type: choice
        options:
          - inventario
          - baseline
          - incremental
      confirmacao:
        description: Para baseline, digite CRIAR_BASELINE
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rodar operacao segura
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_IDS: ${{ secrets.DRIVE_FOLDER_IDS }}
          DRIVE_SYNC_ENABLED: ${{ vars.DRIVE_SYNC_ENABLED }}
          OPERACAO: ${{ inputs.operacao || 'incremental' }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          case "$OPERACAO" in
            inventario) npm run drive:inventory ;;
            baseline)
              if [ "$CONFIRMACAO" != "CRIAR_BASELINE" ]; then
                echo "::error::Confirmação de baseline ausente."
                exit 1
              fi
              DRIVE_BASELINE_APPROVED=true npm run drive:baseline
              ;;
            incremental) npm run sync-drive ;;
            *) echo "::error::Operação inválida."; exit 1 ;;
          esac
